<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ร่วมงานกับเรา · สมัครงานออนไลน์ บริษัท พุช มีเดีย จำกัด">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Push Media">
<meta property="og:title" content="ใบสมัครงาน · Push Media">
<meta property="og:description" content="ร่วมงานกับเรา · สมัครงานออนไลน์ บริษัท พุช มีเดีย จำกัด">
<meta property="og:url" content="https://itsupport2-pixel.github.io/pushmedia-careers/">
<meta property="og:image" content="https://itsupport2-pixel.github.io/pushmedia-careers/og-image.png?v=1">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary">
<title>ใบสมัครงาน · Push Media</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ink:#16181D; --ink-2:#4A5060; --ink-3:#7C8394;
  --paper:#F3F4F2; --surface:#FFFFFF; --sunk:#ECEEEA; --line:#DCDFD8; --line-2:#E8EAE5;
  --accent:#1E4FD8; --accent-ink:#FFFFFF; --accent-soft:#E6ECFC;
  --ok:#147D4F; --ok-soft:#E2F3EA; --warn:#A35D00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FCE8E6; --vio:#6B3FC7; --vio-soft:#EEE7FB;
  --sheet:#FFFFFF; --sheet-ink:#111;
  --r:10px;
  --f-ui:"Sarabun","TH Sarabun New","Leelawadee UI",Tahoma,sans-serif;
  --f-doc:"Sarabun","TH Sarabun New",Tahoma,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
.brand svg{flex:none}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.65;letter-spacing:.08em;text-transform:uppercase}
.modes{margin-left:auto;display:flex;gap:4px;background:#ffffff14;padding:4px;border-radius:999px;flex-wrap:wrap}
.modes button{border:0;background:none;color:#fff;opacity:.72;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}
.modes button[aria-pressed="true"]{background:#fff;color:#16181D;opacity:1;font-weight:600}
.modes button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.demo-note{background:var(--warn-soft);color:var(--warn);font-size:12.5px;text-align:center;padding:6px 16px}

main{padding-block:24px 64px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--accent-soft);color:var(--accent)}
.s-screen{background:var(--warn-soft);color:var(--warn)}
.s-interview{background:var(--vio-soft);color:var(--vio)}
.s-offer{background:#E3F1F7;color:#0B6A8C}
.s-hired{background:var(--ok-soft);color:var(--ok)}
.s-reject{background:var(--bad-soft);color:var(--bad)}

/* ── applicant ── */
.apply{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.steps{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;padding:10px}
.steps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:14px}
.steps button .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line);color:var(--ink-3)}
.steps button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps button[aria-current="step"] .n{border-color:var(--accent);color:var(--accent)}
.steps .save{margin-top:10px;font-size:12.5px;color:var(--ink-3);padding:0 10px}
.panel{padding:28px}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .lead{color:var(--ink-2);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 3}
.f.s2{grid-column:span 2}.f.s6{grid-column:span 6}.f.s4{grid-column:span 4}
.f label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.f label .req{color:var(--bad)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:40px}
textarea.inp{min-height:84px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sec{grid-column:span 6;margin-top:10px;padding-top:14px;border-top:1px solid var(--line-2);font-weight:600;font-size:15px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;grid-column:span 6;border:1px solid var(--line);border-radius:8px}
table.edu{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.edu th{background:var(--sunk);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line)}
table.edu td{padding:4px;border-bottom:1px solid var(--line-2)}
table.edu td:first-child{padding-left:10px;font-weight:500;white-space:nowrap}
table.edu input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px}
table.edu input:hover{border-color:var(--line)}

/* step 3 blocks */
.blk{border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;background:var(--surface)}
.blk+.blk{margin-top:14px}
.blk-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:16px;font-weight:600}
.blk-h .ico{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.blk-h .ico svg{width:17px;height:17px}
.blk-sub{margin:0 0 14px 40px;font-size:13px;color:var(--ink-3)}
.fam{display:grid;grid-template-columns:110px minmax(0,2fr) 76px auto minmax(0,1.3fr);gap:12px;align-items:end;padding:12px 0;border-top:1px dashed var(--line-2)}
.fam:first-of-type{border-top:0;padding-top:0}
.fam .who-l{font-weight:600;font-size:14px;padding-bottom:9px}
.fam .f{grid-column:auto}
.fam .seg{min-height:40px;align-items:center}
.yn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line-2)}
.yn:first-of-type{border-top:0}
.yn .q{font-size:14.5px}
.veh-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.veh{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:12px}
.veh.on{background:var(--surface);border-color:var(--accent)}
.veh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.veh-top svg{width:34px;height:34px;flex:none;color:var(--ink-2)}
.veh-top b{font-size:15px;flex:1}
.veh .sub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.veh .sub .f{grid-column:auto}
.veh .off-note{font-size:13px;color:var(--ink-3)}
.sk-grp{margin-top:12px}
.sk-grp:first-of-type{margin-top:0}
.sk-grp .gt{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;letter-spacing:.02em}
.sk{display:flex;flex-wrap:wrap;gap:6px}
.sk .chip{display:inline-flex;align-items:center;gap:6px}
.sk .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sk .chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.sk-add{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sk-add .inp{flex:1;min-width:200px}
.sk-count{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.skills-out{display:flex;flex-wrap:wrap;gap:5px}
.skills-out span{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.sk-admin .sk-row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.sk-admin .sk-row:first-child{border-top:0}
.sk-admin .sk-row>b{width:180px;font-weight:600;padding-top:4px}
.sk-admin .sk{flex:1;min-width:220px}
.sk-admin .tg{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;background:var(--surface)}
.sk-admin .tg button{border:0;background:none;cursor:pointer;color:var(--ink-3);width:20px;height:20px;border-radius:50%}
.sk-admin .tg button:hover{background:var(--bad-soft);color:var(--bad)}
@media (max-width:760px){.fam{grid-template-columns:1fr 1fr}.fam .who-l{grid-column:span 2;padding-bottom:0}.fam .fname{grid-column:span 2}.veh-grid{grid-template-columns:1fr}}
/* position combobox */
.combo{position:relative}
.combo .inp{padding-right:36px}
.combo .clr{position:absolute;right:6px;top:31px;width:28px;height:28px;border:0;background:none;color:var(--ink-3);cursor:pointer;border-radius:6px}
.combo .clr:hover{background:var(--sunk)}
.cb-list{margin-top:4px;border:1px solid var(--line);border-radius:10px;max-height:320px;overflow:auto;background:var(--surface)}
.cb-grp{padding:8px 12px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--sunk);position:sticky;top:0}
.cb-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line-2);background:none;padding:10px 12px;cursor:pointer}
.cb-opt:hover,.cb-opt.act{background:var(--accent-soft)}
.cb-opt[aria-selected="true"]{font-weight:600}
.cb-opt[aria-selected="true"]::after{content:"✓";color:var(--accent);font-weight:700}
.cb-opt .o{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap;font-weight:400}
.cb-opt mark{background:#FFE58A;color:#16181D;border-radius:3px;padding:0 1px}
.cb-empty{padding:14px 12px;color:var(--ink-3);font-size:13.5px}
.cb-custom{border-top:1px dashed var(--line)}
/* uploads */
.up-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.photo-box{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.photo{width:150px;aspect-ratio:3/4;max-width:100%;border-radius:8px;border:1.5px dashed var(--line);background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;color:var(--ink-3);font-size:12.5px;text-align:center;padding:8px}
.photo.has{border-style:solid}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--sunk);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;margin-bottom:2px}
.req-list{display:grid;gap:8px;margin-top:16px}
.req-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex-wrap:wrap}
.req-item .ic{flex:none;width:38px;height:46px;border-radius:5px;background:var(--sunk);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink-3);overflow:hidden;background-size:cover;background-position:center}
.req-item .ic.pdf{background:#FCE8E6;color:#B42318}
.req-item .meta{flex:1;min-width:150px}
.req-item .meta b{display:block;font-size:14px;font-weight:600}
.req-item .meta span{font-size:12.5px;color:var(--ink-3)}
.req-item .st{font-size:12.5px;font-weight:600}
.req-item .st.ok{color:var(--ok)} .req-item .st.miss{color:var(--bad)}
.consent{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-size:14px;margin-top:18px}
.consent input{margin-top:4px;width:18px;height:18px;flex:none}

/* A4 doc */
.doc-stage{background:var(--sunk);border-radius:10px;padding:24px;overflow-x:auto}
.a4{width:794px;min-height:1123px;margin:0 auto;background:var(--sheet);color:var(--sheet-ink);font:15px/1.9 var(--f-doc);padding:46px 58px;box-shadow:0 1px 2px #0000001a,0 8px 24px #00000014;position:relative}
.a4+.a4{margin-top:18px}
.a4 .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.a4 .logo{display:flex;align-items:center;gap:8px;font:700 26px/1 var(--f-ui);letter-spacing:-.01em}
.a4 .logo small{display:block;font:400 11px/1.2 var(--f-ui);letter-spacing:.02em}
.a4 .ttl{font:700 34px/1 var(--f-doc);text-align:right}
.a4 .ph{width:96px;height:124px;border:1px dotted #555;display:grid;place-items:center;font-size:12px;text-align:center;background:center/cover no-repeat;margin-top:8px;margin-left:auto}
.a4 .co{font-size:13px;line-height:1.6;margin-top:6px}
.a4 .ln{display:flex;flex-wrap:wrap;column-gap:14px}
.a4 .fld{display:inline-flex;gap:6px;align-items:baseline}
.a4 .v{display:inline-block;min-width:90px;border-bottom:1px dotted #444;padding:0 6px;font-weight:600;line-height:1.5;color:#0B2E8A}
.a4 .v.w{min-width:230px}.a4 .v.xw{min-width:420px}
.a4 .box{display:inline-flex;align-items:center;gap:4px;margin-right:12px}
.a4 .box i{width:13px;height:13px;border:1px solid #222;display:inline-grid;place-items:center;font-style:normal;font-size:12px;line-height:1;color:#0B2E8A;font-weight:700}
.a4 h4{font:700 15px/1.6 var(--f-doc);margin:14px 0 4px}
.a4 table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.5}
.a4 th,.a4 td{border:1px solid #333;padding:3px 6px;text-align:left}
.a4 th{font-weight:700;text-align:center}
.a4 td.v2{color:#0B2E8A;font-weight:600}
.a4 .sign{margin-top:28px;text-align:right;padding-right:40px}
.a4 .stamp{position:absolute;right:58px;bottom:40px;font:500 11px/1.4 var(--f-mono);color:#666;text-align:right}
.a4 .pg{position:absolute;left:58px;bottom:40px;font:11px var(--f-mono);color:#888}
.sheet-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* done */
.done{text-align:center;padding:40px 24px}
.done .big{font:600 13px var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
.done h2{font-size:26px;margin:6px 0 10px}
.track{display:flex;justify-content:center;gap:0;margin:26px auto 8px;max-width:640px;flex-wrap:wrap}
.track div{flex:1;min-width:96px;position:relative;padding-top:28px;font-size:12.5px;color:var(--ink-3)}
.track div::before{content:"";position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--line);z-index:1}
.track div::after{content:"";position:absolute;top:14px;left:0;right:0;height:2px;background:var(--line)}
.track div.on{color:var(--ink);font-weight:600}
.track div.on::before{background:var(--ok)}

/* ── admin ── */
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.adm-head h1{font-size:26px}
.roles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi .n{font:600 28px/1.2 var(--f-ui);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--ink-3)}
.pipe{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:2px;margin-top:10px;background:var(--sunk)}
.pipe span{display:block;height:100%}
.adm-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.filters .inp{min-height:36px;padding:6px 10px;width:auto}
.filters input.inp{flex:1;min-width:180px}
.list-wrap{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
table.list th{text-align:left;font-size:12px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:var(--sunk)}
table.list tr.row:focus-visible td{background:var(--accent-soft);outline:none}
.who{display:flex;align-items:center;gap:10px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sunk) center/cover;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-2)}
.who b{display:block;font-weight:600}
.who span{font-size:12.5px;color:var(--ink-3)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.side{display:flex;flex-direction:column;gap:18px}
.side .card{padding:16px}
.side h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.notif{display:flex;flex-direction:column;gap:0}
.notif li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.notif li:first-child{border-top:0}
.notif .ch{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 10px var(--f-ui);color:#fff}
.ch.line{background:#06C755}.ch.mail{background:#5B6475}.ch.sys{background:var(--accent)}
.notif time{display:block;font-size:12px;color:var(--ink-3)}
ul.notif,ul.sched{margin:0;padding:0}
.unread{font-size:11.5px;background:var(--bad);color:#fff;border-radius:999px;padding:1px 8px;font-weight:600}
.sched li{list-style:none;display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.sched li:first-child{border-top:0}

/* drawer */

.dr-head h2{font-size:20px}

.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px}

.att .cap{padding:8px 10px;font-size:12.5px}

.act .card{padding:16px}
.act{display:flex;flex-direction:column;gap:14px}
.stage-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.rating{display:flex;gap:4px}
.rating button{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;cursor:pointer;font-weight:600}

.cm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.viewer{position:fixed;inset:0;z-index:60;background:#0b0d12e6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

.viewer .bar{color:#fff;display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.viewer .bar .btn{background:#ffffff1a;border-color:#ffffff33;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;box-shadow:0 8px 24px #0004;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast .ch{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 9px var(--f-ui);color:#fff;flex:none}

/* ── overview ── */
.ov h1{font-size:28px;margin-bottom:6px}

.ov-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

.matrix{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix th{font-size:12px;color:var(--ink-3);font-weight:600}
.y{color:var(--ok);font-weight:700}.n0{color:var(--ink-3)}.p{color:var(--warn);font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.flow span{padding:6px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.flow em{font-style:normal;color:var(--ink-3)}
.span2{grid-column:span 2}
.code{font:13px/1.6 var(--f-mono);background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre}

/* admin tabs + settings */
.adm-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.adm-tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px}
.adm-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.adm-tabs button[disabled]{opacity:.45;cursor:not-allowed}
.set{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;padding:8px;position:sticky;top:84px}
.set-nav button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.set-nav button small{font-size:12px;color:var(--ink-3)}
.set-nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.set-main{padding:22px}
.set-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.set-head h2{font-size:20px}
.set-head p{margin:4px 0 0;color:var(--ink-3);font-size:13.5px;max-width:60ch}
table.mg{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.mg th{text-align:left;font-size:12px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.mg td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.mg tr.off td{color:var(--ink-3)}
.acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:7px;min-width:32px;height:30px;padding:0 8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.ib:hover{border-color:var(--ink-3);color:var(--ink)}
.ib.del:hover{border-color:var(--bad);color:var(--bad)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled+span{opacity:.5}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-3);font-weight:600}
.tag.cu{background:var(--vio-soft);color:var(--vio)}
.step-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fl-row{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 70px 70px auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line-2)}
.fl-row.hd{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.fl-row.off .nm{color:var(--ink-3);text-decoration:line-through}
.fl-row .nm b{font-weight:600}
.fl-row .nm small{display:block;color:var(--ink-3);font-size:12px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv .ib{height:18px;min-width:26px;font-size:10px;padding:0}
.md-wrap{position:fixed;inset:0;z-index:70;background:#0b0d1266;display:grid;place-items:center;padding:16px}
.md{background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px #0005}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.md-h h3{font-size:17px}
.md-b{padding:18px 20px;overflow:auto}
.md-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.md-err{color:var(--bad);font-size:13px;margin-top:8px}
.ed-sec{position:relative}
.ed-sec+.ed-sec{margin-top:14px}
.ed-sec h4{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.rule{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,80px);align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line-2);font-size:14px}
.rule.hd{font-size:12px;color:var(--ink-3);font-weight:600}
.rule>span:not(:first-child){display:flex;justify-content:center}
.extra-note{grid-column:span 6;font-size:12.5px;color:var(--vio);margin-top:4px}
@media (max-width:900px){.set{grid-template-columns:1fr}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-nav button{white-space:nowrap}.set-nav button small{display:none}}
@media (max-width:640px){.fl-row{grid-template-columns:auto minmax(0,1fr) auto}.fl-row>.c-type,.fl-row>.c-req,.fl-row>.c-on{display:none}.rule{grid-template-columns:minmax(0,1fr) repeat(4,46px)}}
@media (max-width:900px){
  .apply{grid-template-columns:1fr}

  .steps button{white-space:nowrap}
  .steps .save{display:none}
  .adm-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dr-body{grid-template-columns:1fr}
  .ov-grid{grid-template-columns:1fr}.span2{grid-column:auto}
  .up-grid{grid-template-columns:1fr}
}
@media (max-width:560px){

  .f,.f.s2,.f.s4{grid-column:span 6}
  .doc-stage{padding:10px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── production additions ── */
.err-box{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 14px;font-size:14px;margin:0 0 16px}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 14px;font-size:14px;margin:0 0 16px}
.f.bad .inp,.f.bad .seg .chip{border-color:var(--bad)}

.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--ink-3)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.login{max-width:420px;margin:40px auto;padding:28px}

.track-card{max-width:520px;margin:20px auto;padding:26px}
.topnav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

}

/* แบรนด์จริง Push Media */

.brand .logo{height:34px;width:auto;flex:none;display:block}

.steps button.warn .n{background:var(--warn);border-color:var(--warn);color:#fff}

/* ใช้ธีมสว่างเสมอ (เอกสารทางการ) — ไม่ตามโหมดมืดของเครื่อง · 7 ต.ค. 2569 */
:root{color-scheme:light only}
html,body{background:var(--paper)!important;color:var(--ink)}
.top{background:#16181D!important;color:#fff}

/* ที่อยู่ไทย autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px #0002;max-height:300px;overflow:auto;min-width:min(420px,90vw)}
.ac-opt{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line-2);background:none;padding:9px 12px;cursor:pointer;font-size:14px;line-height:1.4}

.bd-row{display:grid;grid-template-columns:.8fr 1fr 1.15fr;gap:6px}

/* date picker วันเกิด */

.dp-d{border:0;background:none;border-radius:8px;height:34px;cursor:pointer;font-variant-numeric:tabular-nums}
.dp-d:hover{background:var(--accent-soft)}
.dp-d.on{background:var(--accent);color:#fff;font-weight:600}

/* หน้าข้อมูลผู้สมัคร: เต็มจอ อ่านง่าย (7 ต.ค.) */
.drawer{width:100%!important;left:0}
.dr-head{padding-left:max(20px,calc((100% - 1280px)/2 + 20px));padding-right:max(20px,calc((100% - 1280px)/2 + 20px))}

/* รูปผู้สมัครในรายการ */
table.list .ph-av{width:46px;height:58px;border-radius:8px;background-size:cover;background-position:center top;border:1px solid var(--line)}

/* การ์ดลิงก์รับสมัครงาน */
.share{padding:18px!important}
.share-h{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}

.share-drive span{flex:none;width:32px;height:32px;border-radius:8px;background:#E8F0FE;color:#1A73E8;display:grid;place-items:center}

.cf-wrap{z-index:90}

/* หน้าติดตามสถานะ (ออกแบบใหม่ 7 ต.ค.) */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stx{max-width:640px;margin:28px auto 40px}
.stx-hero{text-align:center;margin-bottom:22px}
.stx-badge{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:#16181D;color:#fff;margin-bottom:12px}
.stx-badge svg{width:26px;height:26px}
.stx-hero h1{font-size:28px;margin-bottom:6px}
.stx-hero p{margin:0;color:var(--ink-3);font-size:15px}
.stx-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px #16181d0d}
.stx-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stx-ic{color:var(--ink-3);display:grid}
.stx-ic svg{width:20px;height:20px}
.stx-search input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:10px 4px;background:none;letter-spacing:.02em}
.stx-search .btn{padding:11px 22px;border-radius:10px;font-size:15px}
.stx-count{font-size:13px;color:var(--ink-3);margin:22px 0 8px}
.stx-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:12px;box-shadow:0 2px 6px #16181d08;--c:var(--accent);--cs:var(--accent-soft)}
.stx-card.t-ok{--c:var(--ok);--cs:var(--ok-soft)}.stx-card.t-bad{--c:var(--bad);--cs:var(--bad-soft)}.stx-card.t-vio{--c:var(--vio);--cs:var(--vio-soft)}.stx-card.t-warn{--c:var(--warn);--cs:var(--warn-soft)}
.stx-card header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.stx-no{font:500 12px var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.stx-card h2{font-size:20px;margin:2px 0 4px}
.stx-card header p{margin:0;font-size:13.5px;color:var(--ink-3)}
.stx-pill{flex:none;background:var(--cs);color:var(--c);font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px}
.stx-steps{list-style:none;margin:22px 0 4px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.stx-steps::before,.stx-steps::after{content:"";position:absolute;top:15px;left:12.5%;height:3px;border-radius:3px}
.stx-steps::before{right:12.5%;background:var(--line-2)}
.stx-steps::after{width:calc(75% * var(--pct));background:var(--c)}
.stx-steps li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.stx-steps .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#fff;border:2px solid var(--line);color:var(--ink-3)}
.stx-steps .dot svg{width:15px;height:15px}
.stx-steps li.is-done .dot{background:var(--c);border-color:var(--c);color:#fff}
.stx-steps li.is-cur .dot{border-color:var(--c);color:var(--c);box-shadow:0 0 0 5px var(--cs)}
.stx-steps li.is-fail .dot{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 0 0 5px var(--bad-soft)}
.stx-steps .lb{font-size:13px;color:var(--ink-3);line-height:1.35;max-width:110px}
.stx-steps li.is-done .lb,.stx-steps li.is-cur .lb,.stx-steps li.is-fail .lb{color:var(--ink);font-weight:600}
.stx-note{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55}
.stx-note>span{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff}
.stx-note>span svg{width:18px;height:18px}
.stx-note b{display:block;font-size:13px}
.stx-note small{display:block;font-size:12.5px;opacity:.8;margin-top:2px}
.n-vio{background:var(--vio-soft);color:#3c2475}.n-vio>span{color:var(--vio)}
.n-mute{background:var(--sunk);color:var(--ink-2)}
.stx-empty{margin-top:18px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:22px}
.stx-empty b{display:block;font-size:16px;margin-bottom:4px}
.stx-empty span{font-size:14px;color:var(--ink-3)}
.stx-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:13.5px;color:var(--ink-3)}
.stx-foot a{color:var(--ink-2);text-decoration:none;font-weight:500}
.stx-foot a:hover{color:var(--accent)}
.stx-foot span{display:inline-flex;align-items:center;gap:6px}
.stx-foot svg{width:14px;height:14px}
@media (max-width:520px){.stx-hero h1{font-size:23px}.stx-search .btn{padding:10px 14px}.stx-steps .lb{font-size:12px}.stx-card{padding:16px}}

/* รูปตัวอย่างไฟล์แนบ */
.att .th{position:relative;background-size:cover;background-position:center top;background-color:var(--sunk)}
.att .th.has{background-color:#fff}
.att .th .badge{position:absolute;left:8px;top:8px;background:#B42318;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
.att .th:not(.pdf) .badge{background:var(--ink-2)}
.att .th .spin{width:18px;height:18px}
.att:hover .th.has{filter:brightness(.96)}

/* AI วิเคราะห์คุณสมบัติ */
.ai-card .ai-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ai-card h3{font-size:15px;margin:0}
.ai-tag{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--vio-soft);color:var(--vio);font-weight:600}
.ai-note{font-size:12.5px;margin:0;line-height:1.6}
.ai-busy{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);padding:8px 0}
.ai-busy .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--vio);border-radius:50%;animation:aispin .8s linear infinite;flex:none}
@keyframes aispin{to{transform:rotate(360deg)}}
.ai-fit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px}
.ai-fit .ai-lbl{display:block;font-size:11.5px;color:var(--ink-2)}
.ai-fit b{font-size:17px}
.ai-fit.ai-ok{background:var(--ok-soft)}.ai-fit.ai-warn{background:var(--warn-soft)}.ai-fit.ai-bad{background:var(--bad-soft)}
.ai-score{text-align:right;font-variant-numeric:tabular-nums}.ai-score b{font-size:22px}.ai-score span{font-size:12px;color:var(--ink-2)}
.ai-bar{height:6px;border-radius:3px;background:var(--sunk);margin:8px 0 10px;overflow:hidden}
.ai-bar i{display:block;height:100%;border-radius:3px}
.ai-bar i.ai-ok{background:var(--ok)}.ai-bar i.ai-warn{background:var(--warn)}.ai-bar i.ai-bad{background:var(--bad)}
.ai-sum{font-size:13.5px;line-height:1.65;margin:0 0 4px}
.ai-sec{font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 4px;letter-spacing:.02em}
.ai-p{font-size:13px;line-height:1.6;margin:0}
.ai-ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ai-ul li{font-size:13px;line-height:1.55;padding-left:18px;position:relative}
.ai-ul li::before{position:absolute;left:0;top:0;font-weight:700}
.ai-ul.ok li::before{content:'✓';color:var(--ok)}.ai-ul.warn li::before{content:'!';color:var(--warn);left:4px}
.ai-ol{margin:0;padding-left:20px;display:grid;gap:4px}.ai-ol li{font-size:13px;line-height:1.55}
.ai-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);line-height:1.5}
</style>
</head>

function bindBirth(p){

  var st={y:+b.y||yNow-25,m:b.m?TH_MON.indexOf(b.m):0};
  var draw=function(){var ys=[];for(var y=yNow-15;y>=yNow-70;y--)ys.push(y);
    var first=new Date(st.y-543,st.m,1).getDay(),nd=new Date(st.y-543,st.m+1,0).getDate(),cur=birthParts(),cells='';
    for(var i=0;i<first;i++)cells+='<span></span>';
    for(var d=1;d<=nd;d++){var on=cur.d==d&&cur.m===TH_MON[st.m]&&+cur.y===st.y;cells+='<button type="button" class="dp-d'+(on?' on':'')+'" data-d="'+d+'">'+d+'</button>'}
    pop.innerHTML='<div class="dp-h"><button type="button" class="ib" data-mv="-1" aria-label="เดือนก่อน">‹</button><select class="inp" data-dm aria-label="เดือน">'+TH_MON_F.map(function(m,i){return '<option value="'+i+'"'+(i===st.m?' selected':'')+'>'+m+'</option>'}).join('')+'</select><select class="inp" data-dy aria-label="ปี พ.ศ.">'+ys.map(function(y){return '<option'+(y===st.y?' selected':'')+'>'+y+'</option>'}).join('')+'</select><button type="button" class="ib" data-mv="1" aria-label="เดือนถัดไป">›</button></div>'+
      '<div class="dp-g">'+['อา','จ','อ','พ','พฤ','ศ','ส'].map(function(x){return '<b>'+x+'</b>'}).join('')+cells+'</div>';
    $('[data-dm]',pop).addEventListener('change',function(e){st.m=+e.target.value;draw()});
    $('[data-dy]',pop).addEventListener('change',function(e){st.y=+e.target.value;draw()});
    $$('[data-mv]',pop).forEach(function(x){x.addEventListener('click',function(){st.m+=+x.dataset.mv;if(st.m<0){st.m=11;st.y--}if(st.m>11){st.m=0;st.y++}st.y=Math.max(yNow-70,Math.min(yNow-15,st.y));draw()})});
    $$('[data-d]',pop).forEach(function(x){x.addEventListener('click',function(){setBirth(+x.dataset.d,st.m,st.y,p);close();btn.focus()})});
  };
  var close=function(){pop.hidden=true;document.removeEventListener('mousedown',outside)};
  var outside=function(e){if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target))close()};
  btn.addEventListener('click',function(){if(!pop.hidden){close();return}draw();pop.hidden=false;document.addEventListener('mousedown',outside)});
  pop.addEventListener('keydown',function(e){if(e.key==='Escape'){close();btn.focus()}});
}
function bindSelects(p){
  $$('[data-sel]',p).forEach(function(el){el.addEventListener('change',function(){var k=el.dataset.sel,o=$('[data-selo="'+k+'"]',p);if(el.value==='__o'){o.hidden=false;o.focus();S.form[k]=o.value.trim()}else{o.hidden=true;S.form[k]=el.value}saveDraft()})});
  $$('[data-selo]',p).forEach(function(el){el.addEventListener('input',function(){S.form[el.dataset.selo]=el.value.trim();saveDraft()})});
}
function idOk(v){var d=String(v||'').replace(/\D/g,'');if(d.length!==13)return false;var s=0;for(var i=0;i<12;i++)s+=+d[i]*(13-i);return (11-s%11)%10===+d[12]}

  if(i===1&&F.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.email))out.push([1,'อีเมล (รูปแบบไม่ถูกต้อง)','email']);

  if(i===4){if(!S.files.photo)out.push([4,'รูปถ่ายหน้าตรง','photo']);CFG.docs.forEach(function(d){if(d.req&&!S.files[d.k])out.push([4,d.t,d.k])});

function imgResize(file,W,H,crop){return new Promise(function(res,rej){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){
  var cv=document.createElement('canvas'),cx;
  if(crop){var r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;cv.width=W;cv.height=H;cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(img,(W-w)/2,Math.min(0,(H-h)/4),w,h)}
  else{var s=Math.min(1,W/Math.max(img.width,img.height));cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height)}
  res(cv.toDataURL('image/jpeg',.86))};img.onerror=function(){rej(new Error('เปิดรูปนี้ไม่ได้ ลองบันทึกเป็น JPG แล้วแนบใหม่'))};img.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
function uploadFile(file,slot){
  if(!slot){toast('แนบเอกสารครบทุกช่องแล้ว ลบไฟล์เดิมก่อนถ้าต้องการเปลี่ยน',true);return}
  var isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name),isImg=/^image\//.test(file.type);
  if(!isPdf&&!isImg){toast('รองรับเฉพาะรูปภาพหรือ PDF',true);return}
  if(slot==='photo'&&!isImg){toast('รูปถ่ายต้องเป็นไฟล์รูปภาพ',true);return}
  if(file.size>CFG.maxMB*1048576){toast('ไฟล์ '+file.name+' ใหญ่เกิน '+CFG.maxMB+' MB',true);return}

  prep.then(function(dataUrl){
    var name=isPdf?file.name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime=isPdf?'application/pdf':'image/jpeg';
    var url=dataUrl||'';var sizeKB=Math.max(1,Math.round((dataUrl?dataUrl.length*.75:file.size)/1024));

    return fileToB64(dataUrl||file).then(function(b64){return call('uploadPending',S.draftId,{name:name,mime:mime,slot:slot},b64)}).then(function(r){
      var cur=S.files[slot];if(!cur||cur.name!==name)return;cur.fileId=r.fileId;cur.uploading=false;cur.sizeKB=r.sizeKB;saveDraft();if(S.step===4)renderApply()});
  }).catch(function(e){delete S.files[slot];if(S.step===4)renderApply();toast('อัปโหลด '+file.name+' ไม่สำเร็จ: '+em(e),true)});

function bindCombo(p){
  var q=$('#posq',p),box=$('#cb-list',p),act=-1,typed=false;
  function norm(x){return String(x||'').toLowerCase().replace(/\s+/g,' ').trim()}
  function hi(t,k){if(!k)return esc(t);var i=norm(t).indexOf(k);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+k.length))+'</mark>'+esc(t.slice(i+k.length))}
  function draw(){
    var k=typed?norm(q.value):'',words=k.split(' ').filter(Boolean);
    var hit=CFG.positions.filter(function(x){var h=norm(x.name+' '+x.dept);return words.every(function(w){return h.indexOf(w)>=0})});
    var groups={},order=[];hit.forEach(function(x){if(!groups[x.dept]){groups[x.dept]=[];order.push(x.dept)}groups[x.dept].push(x)});
    var html='';
    order.forEach(function(g){html+='<div class="cb-grp">'+esc(g)+'</div>'+groups[g].map(function(x){return '<button type="button" class="cb-opt" role="option" data-id="'+esc(x.id)+'" aria-selected="'+(S.form.pos===x.id)+'"><span>'+hi(x.name,words[0]||'')+'</span><span class="o">'+x.open+' อัตรา</span></button>'}).join('')});
    var exact=hit.some(function(x){return norm(x.name)===k});
    if(!hit.length&&k)html='<div class="cb-empty">ไม่พบตำแหน่งที่ตรงกับ “'+esc(q.value.trim())+'”</div>';
    if(!hit.length&&!k)html='<div class="cb-empty">ขณะนี้ยังไม่มีตำแหน่งที่เปิดรับ · พิมพ์ชื่อตำแหน่งเพื่อฝากประวัติได้</div>';
    if(k&&!exact)html+='<button type="button" class="cb-opt cb-custom" role="option" data-custom="1"><span>ฝากประวัติตำแหน่ง “<b>'+esc(q.value.trim())+'</b>”</span><span class="o">พิจารณาเมื่อมีตำแหน่งว่าง</span></button>';
    box.innerHTML=html;act=-1;
    $$('.cb-opt',box).forEach(function(b){b.addEventListener('mousedown',function(e){e.preventDefault()});b.addEventListener('click',function(){pick(b)})});
  }
  function pick(b){S.form.pos=b.dataset.custom?q.value.trim().slice(0,120):b.dataset.id;saveDraft();var y=window.scrollY;renderApply();window.scrollTo(0,y)}
  function move(d){var o=$$('.cb-opt',box);if(!o.length)return;act=(act+d+o.length)%o.length;o.forEach(function(x,j){x.classList.toggle('act',j===act)});o[act].scrollIntoView({block:'nearest'})}
  q.addEventListener('input',function(){typed=true;draw()});
  q.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();move(1)}else if(e.key==='ArrowUp'){e.preventDefault();move(-1)}else if(e.key==='Enter'){var o=$$('.cb-opt',box);if(o.length){e.preventDefault();pick(o[act>=0?act:0])}}else if(e.key==='Escape'){q.value=S.form.pos?pos(S.form.pos).name:'';typed=false;draw()}});
  $('#posclr',p).addEventListener('click',function(){q.value='';typed=true;draw();q.focus()});
  draw();
}

/* ป๊อปอัปยืนยันก่อนบันทึก (ทุกการบันทึก) → Promise<boolean> */
function confirmBox(title,msg,okText,danger){return new Promise(function(res){
  var w=document.createElement('div');w.className='md-wrap cf-wrap';
  w.innerHTML='<div class="md" role="alertdialog" aria-modal="true" aria-label="'+esc(title)+'" style="width:min(420px,100%)"><div class="md-b" style="padding:22px 22px 10px"><h3 style="font-size:17px;margin-bottom:6px">'+esc(title)+'</h3>'+(msg?'<p class="muted" style="margin:0;font-size:14px">'+msg+'</p>':'')+'</div><div class="md-f"><button type="button" class="btn" data-cf="0">ยกเลิก</button><button type="button" class="btn btn-p" data-cf="1"'+(danger?' style="background:var(--bad);border-color:var(--bad)"':'')+'>'+esc(okText||'ยืนยัน')+'</button></div></div>';
  document.body.appendChild(w);var done=function(v){w.remove();res(v)};
  $$('[data-cf]',w).forEach(function(b){b.addEventListener('click',function(){done(b.dataset.cf==='1')})});
  w.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();done(false)}});
  w.addEventListener('mousedown',function(e){if(e.target===w)done(false)});
  $('[data-cf="1"]',w).focus();
})}
function askClose(){
  if($('.md-wrap'))return;
  var w=document.createElement('div');w.className='md-wrap';
  w.innerHTML='<div class="md" role="alertdialog" aria-modal="true" aria-label="ปิดหน้าข้อมูลผู้สมัคร" style="width:min(400px,100%)"><div class="md-b" style="padding:22px 22px 8px"><h3 style="font-size:17px;margin-bottom:6px">ปิดหน้าข้อมูลผู้สมัครไหม?</h3><p class="muted" style="margin:0;font-size:14px">ข้อมูลที่บันทึกแล้วไม่หาย · ความเห็นที่พิมพ์ค้างไว้แต่ยังไม่กดส่งจะหายไป</p></div><div class="md-f"><button type="button" class="btn" id="ac-no">อยู่หน้านี้ต่อ</button><button type="button" class="btn btn-p" id="ac-yes">ปิด</button></div></div>';
  document.body.appendChild(w);var no=$('#ac-no',w);no.focus();
  no.addEventListener('click',function(){w.remove()});$('#ac-yes',w).addEventListener('click',function(){w.remove();closeDrawer()});
  w.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();w.remove()}});
}
function closeDrawer(){A.open=null;var d=$('.drawer'),s=$('.scrim');if(d)d.remove();if(s)s.remove();document.body.style.overflow=''}
function syncRow(a){var r=A.d.apps.filter(function(x){return x.no===a.no})[0];if(r){r.stage=a.stage;r.rating=a.rating;r.interview=a.interview;r.first=a.form.first;r.last=a.form.last;r.nick=a.form.nick;r.posName=a.posName;r.dept=a.dept;r.pos=a.pos;r.files=a.files.length;r.slots=a.files.map(function(f){return f.slot})}}
/* บันทึกแบบไม่ต้องรอ: ยืนยัน → อัปเดตหน้าจอทันที → ส่งเบื้องหลัง → ไม่สำเร็จ = คืนค่าเดิม */
function busy(on){var d=$('.drawer');if(d)d.classList.toggle('busy',!!on)}
function act(conf,local,call,msg){
  return confirmBox(conf[0],conf[1]||'',conf[2]||'บันทึก',conf[3]).then(function(ok){if(!ok)return;
    var a=A.open,snap=JSON.stringify(a),photo=a.photo;
    if(local){local(a);syncRow(a);renderDrawer();if(A.admTab==='apps')renderApps()}
    busy(true);toast('กำลังบันทึก...');
    return call().then(function(x){busy(false);if(A.open&&A.open.no===x.no){x.photo=photo;A.open=x;syncRow(x);renderDrawer()}if(A.admTab==='apps')renderApps();toast(msg||'บันทึกแล้ว')})
      .catch(function(e){busy(false);if(A.open&&A.open.no===a.no){A.open=JSON.parse(snap);syncRow(A.open);renderDrawer();if(A.admTab==='apps')renderApps()}toast('บันทึกไม่สำเร็จ: '+em(e),true)});
  });
}

    onSave:function(fm){var n=fv(fm,'g');if(!n)return 'กรุณากรอกชื่อกลุ่ม';var s=clone(A.d.skills);s[gi].g=n;return save('skills',s)},onDelete:function(){var s=clone(A.d.skills);s.splice(gi,1);return save('skills',s)}})})});
  var addTo=function(gi){var el=$('[data-sin="'+gi+'"]',m),t=el.value.trim();if(!t)return;var s=clone(A.d.skills);if(s[gi].items.indexOf(t)<0)s[gi].items.push(t);save('skills',s,'เพิ่ม "'+t+'" แล้ว')};
  $$('[data-sadd]',m).forEach(function(b){b.addEventListener('click',function(){addTo(+b.dataset.sadd)})});
  $$('[data-sin]',m).forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addTo(+el.dataset.sin)}})});
  $$('[data-sdel]',m).forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.sdel.split('-'),s=clone(A.d.skills);s[+k[0]].items.splice(+k[1],1);save('skills',s,'ลบแล้ว · ผู้สมัครที่เลือกไว้แล้วยังเห็นเหมือนเดิม')})});
}

    '<div class="list-wrap"><table class="mg"><thead><tr><th>สถานะ</th><th>ตอนนี้</th><th>ข้อความถึงผู้สมัคร</th><th></th></tr></thead><tbody>'+
    stg().map(function(x,i){return '<tr><td>'+pill(x.k)+'</td><td>'+(cnt[x.k]||0)+'</td><td class="muted" style="font-size:13px;max-width:380px">'+(x.msg?esc(x.msg):'<i>ไม่ส่งอีเมล</i>')+'</td><td><div class="acts"><button type="button" class="ib" data-sed="'+i+'">แก้ไข</button></div></td></tr>'}).join('')+'</tbody></table></div>';
  $$('[data-sed]',m).forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.sed,x=stg()[i];
    modal({title:'แก้ไขสถานะ "'+x.t+'"',body:'<div class="grid"><div class="f s6"><label for="m-st">ชื่อสถานะ</label><input class="inp" id="m-st" name="t" value="'+esc(x.t)+'"></div><div class="f s6"><label for="m-sm">ข้อความอีเมลถึงผู้สมัคร</label><textarea class="inp" id="m-sm" name="msg" style="min-height:120px">'+esc(x.msg||'')+'</textarea></div></div>',
      onSave:function(fm){var t=fv(fm,'t');if(!t)return 'กรุณากรอกชื่อสถานะ';var s=clone(stg());s[i].t=t;s[i].msg=fv(fm,'msg');return save('stages',s,'บันทึกสถานะแล้ว')}})})});
}

    '<div style="margin-top:16px"><button type="button" class="btn btn-p" id="n-save">บันทึกการตั้งค่า</button></div>'+

    '<div class="grid">'+[['name','ชื่อบริษัท','s6'],['addr1','ที่อยู่ บรรทัดที่ 1','s6'],['addr2','ที่อยู่ บรรทัดที่ 2','s6'],['phone','โทรศัพท์ (ฝ่ายบุคคล)','s3'],['fax','แฟกซ์ (เว้นว่างได้)','s3']].map(function(r){var co=A.d.company||CO;return '<div class="f '+r[2]+'"><label for="co-'+r[0]+'">'+r[1]+'</label><input class="inp" id="co-'+r[0]+'" data-co="'+r[0]+'" value="'+esc(co[r[0]]||'')+'"></div>'}).join('')+'</div>'+
    '<div style="margin-top:16px"><button type="button" class="btn btn-p" id="co-save">บันทึกข้อมูลบริษัท</button></div>'+
    '<div style="margin-top:34px">'+head('AI วิเคราะห์ผู้สมัคร','ใช้ Claude API (Anthropic) · สร้าง API key ที่ console.anthropic.com (คนละส่วนกับ Claude Pro) · key เก็บในระบบ ไม่แสดงบนหน้าเว็บ','')+'</div>'+
    '<p class="muted" style="margin:0 0 10px">สถานะ: '+(A.d.aiKey?'<b style="color:var(--ok)">ตั้งค่าแล้ว</b> <span class="mono">'+esc(A.d.aiKey)+'</span>':'<b>ยังไม่ได้ตั้งค่า</b>')+'</p>'+
    '<div class="grid"><div class="f s6"><label for="ai-key">'+(A.d.aiKey?'เปลี่ยน API key':'API key')+'</label><input class="inp" id="ai-key" type="password" autocomplete="off" placeholder="sk-ant-..."></div></div>'+
    '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-p" id="ai-key-save">บันทึก API key</button>'+(A.d.aiKey?'<button type="button" class="btn" id="ai-key-del">ลบ API key</button>':'')+'</div>';
  $('#ai-key-save',m).addEventListener('click',function(){var v=$('#ai-key',m).value.trim();if(!v){toast('วาง API key ก่อน',true);return}if(!/^sk-ant-/.test(v)){toast('API key ต้องขึ้นต้นด้วย sk-ant-',true);return}save('aiKey',v,'บันทึก API key แล้ว').catch(function(e){toast(em(e),true)})});
  var akd=$('#ai-key-del',m);if(akd)akd.addEventListener('click',function(){save('aiKey','','ลบ API key แล้ว').catch(function(e){toast(em(e),true)})});
  $('#co-save',m).addEventListener('click',function(){var o={};$$('[data-co]',m).forEach(function(x){o[x.dataset.co]=x.value.trim()});
    if(!o.name){toast('กรุณากรอกชื่อบริษัท',true);return}save('company',o,'บันทึกข้อมูลบริษัทแล้ว').catch(function(e){toast(em(e),true)})});
  $('#n-save',m).addEventListener('click',function(){var o={hrMail:$('#n-mail').value.trim()};$$('[data-nk]',m).forEach(function(c){o[c.dataset.nk]=c.checked});
    if(o.hrMail&&!o.hrMail.split(',').every(function(x){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x.trim())})){toast('รูปแบบอีเมลไม่ถูกต้อง',true);return}save('notify',o,'บันทึกการตั้งค่าการแจ้งเตือนแล้ว').catch(function(e){toast(em(e),true)})});

function setUsers(m){

  m.innerHTML=head('ผู้ใช้และสิทธิ์','คนที่เข้าโหมดผู้ดูแลได้ · ข้อมูลอยู่ในชีต Users ของไฟล์นี้ (พิมพ์รหัสผ่านลงชีตตรง ๆ ได้ ระบบจะเข้ารหัสให้ตอนล็อกอินครั้งแรก)','+ เพิ่มผู้ใช้')+

    (us.length?us.map(function(u,i){return '<tr><td class="mono">'+esc(u.code)+'</td><td>'+esc(u.name)+'</td><td><span class="tag">'+(ROLE_T[u.role]||u.role)+'</span></td><td>'+esc(u.scope)+'</td><td>'+(u.hasPw?'<span style="color:var(--ok)">ตั้งแล้ว</span>':'<span style="color:var(--bad)">ยังไม่ตั้ง</span>')+'</td><td><div class="acts"><button type="button" class="ib" data-ued="'+i+'">แก้ไข</button></div></td></tr>'}).join(''):'<tr><td colspan="6" class="muted" style="padding:20px;text-align:center">ยังไม่ได้เพิ่มผู้ใช้</td></tr>')+'</tbody></table></div>'+

  $('#add',m).addEventListener('click',function(){editUser(-1)});

function editUser(i){
  var us=A.d.users||[],u=i>=0?us[i]:{code:'',name:'',role:'mgr',scope:'LED'};
  modal({title:i>=0?'แก้ไขผู้ใช้':'เพิ่มผู้ใช้',danger:i>=0?'ลบสิทธิ์ผู้ใช้':'',
    body:'<div class="grid"><div class="f s2"><label for="m-uc">รหัสผู้ใช้ <span class="req">*</span></label><input class="inp" id="m-uc" name="code" value="'+esc(u.code)+'" maxlength="30"></div><div class="f s4"><label for="m-un">ชื่อที่แสดง</label><input class="inp" id="m-un" name="name" value="'+esc(u.name)+'"></div>'+
      '<div class="f s3"><label for="m-ur">บทบาท</label><select class="inp" id="m-ur" name="role">'+Object.keys(ROLE_T).map(function(k){return '<option value="'+k+'"'+(u.role===k?' selected':'')+'>'+ROLE_T[k]+'</option>'}).join('')+'</select></div>'+
      '<div class="f s3"><label for="m-us">แผนกที่เห็น (หัวหน้าแผนก)</label><select class="inp" id="m-us" name="scope">'+['ทุกแผนก'].concat(depts()).map(function(d){return '<option'+(u.scope===d?' selected':'')+'>'+esc(d)+'</option>'}).join('')+'</select></div>'+
      '<div class="f s6"><label for="m-upw">'+(i>=0?'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)':'รหัสผ่าน <span class="req">*</span>')+'</label><input class="inp" id="m-upw" name="pw" type="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร"></div></div>',
    onSave:function(fm){var c=fv(fm,'code');if(/^\d{1,4}$/.test(c))c=('0000'+c).slice(-4);if(!c)return 'กรุณากรอกรหัสผู้ใช้';var pw=fv(fm,'pw');if(i<0&&!pw)return 'กรุณาตั้งรหัสผ่าน';if(pw&&pw.length<6)return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      if(us.some(function(x,j){return x.code===c&&j!==i}))return 'รหัส '+c+' มีอยู่แล้ว';
      var arr=clone(us),y={code:c,name:fv(fm,'name')||c,role:fv(fm,'role'),scope:fv(fm,'role')==='mgr'?fv(fm,'scope'):'ทุกแผนก',newPassword:pw};if(i>=0)arr[i]=y;else arr.push(y);return save('users',arr,'บันทึกสิทธิ์ '+y.name+' แล้ว')},
    onDelete:function(){var arr=clone(us);arr.splice(i,1);return save('users',arr,'ลบสิทธิ์แล้ว')}});
}
